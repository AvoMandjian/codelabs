name: colorist
description: 'A new Flutter project.'
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter
  colorist_ui:
    path: packages/colorist_ui-0.2.5
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1
  firebase_core: ^3.14.0
  firebase_ai: ^2.1.0
  cloud_text_to_speech: ^1.1.3
  google_speech: ^4.4.0
  waveform_flutter: ^1.2.0
  waveform_recorder: ^1.7.0
  record: ^6.0.0
  cross_file: ^0.3.4+2
  audioplayers: ^6.5.0
  flutter_dotenv: ^5.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.5.4
  riverpod_generator: ^2.6.5
  riverpod_lint: ^2.6.5
  json_serializable: ^6.9.5
  custom_lint: ^0.7.5

flutter:
  uses-material-design: true

  assets:
    - assets/
    - .env
